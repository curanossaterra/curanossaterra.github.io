name: Atualizar últimas lives

on:
  schedule:
    - cron: "17 */3 * * *" # a cada 3 horas
  workflow_dispatch: # botão "Run workflow" para atualizar na hora

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar lives do YouTube
        run: python scripts/atualizar_lives.py

      - name: Salvar se mudou
        run: |
          if git diff --quiet lives.json; then
            echo "Nenhuma live nova."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lives.json
          git commit -m "Atualiza últimas lives"
          git push
