<style>
  :root {
    --fundo: #0f1a2b;       /* azul-marinho escuro */
    --fundo-2: #1b2f4d;
    --botao: #f2ead8;       /* trigo claro */
    --botao-texto: #0f1a2b;
    --texto: #f2ead8;
    --texto-suave: #aebbd0;
    --destaque: #c9a463;    /* dourado do logo */
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    --respiro-topo: 32px;
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(120% 60% at 50% 0%, var(--fundo-2), var(--fundo) 70%);
    background-color: var(--fundo);
    color: var(--texto);
    padding: calc(env(safe-area-inset-top, 0px) + 32px) 20px calc(env(safe-area-inset-bottom, 0px) + 40px);
  }
  main { max-width: 440px; margin: 0 auto; }

  .voltar {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--texto-suave); text-decoration: none; font-size: 15px; font-weight: 600;
  }
  .voltar:hover { color: var(--texto); }
  a:focus-visible { outline: 3px solid var(--destaque); outline-offset: 3px; }

  .logo {
    display: block; width: min(130px, 38vw); aspect-ratio: 1; overflow: hidden;
    margin: 8px auto 0; border-radius: 50%; background: #fff;
    box-shadow: 0 0 0 4px var(--fundo), 0 0 0 7px var(--destaque);
  }
  /* a arte tem muita margem branca: amplia para encostar no círculo */
  .logo img { display: block; width: 100%; height: 100%; transform: scale(1.25); }

  h1 { margin-top: 24px; font-size: 28px; font-weight: 800; text-align: center; }
  .frase { color: var(--texto-suave); margin-top: 8px; font-size: 15px; text-align: center; }

  .agenda { list-style: none; display: grid; gap: 10px; margin-top: 28px; }
  .agenda li {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 14px 18px; border-radius: 16px;
    border: 1px solid rgba(201,164,99,.35); background: rgba(255,255,255,.04);
  }
  .agenda .min {
    flex: none; width: 40px; height: 40px; object-fit: contain;
    border-radius: 8px; background: #fff; box-shadow: 0 0 0 1px rgba(201,164,99,.5);
  }
  .agenda .info { flex: 1; min-width: 0; }
  .agenda .dia { display: block; color: var(--destaque); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  .agenda strong { display: block; font-weight: 600; font-size: 16px; margin-top: 2px; }
  .agenda small { display: block; color: var(--texto-suave); font-size: 13px; margin-top: 2px; }
  .agenda .hora { color: var(--destaque); font-weight: 800; font-size: 16px; white-space: nowrap; }
  .agenda li.tem-banner { cursor: pointer; }
  .agenda li.tem-banner:active { transform: scale(.98); }
  .agenda li.tem-banner:focus-visible { outline: 3px solid var(--destaque); outline-offset: 3px; }
  .agenda li.mes {
    display: flex; align-items: center; gap: 12px; padding: 14px 0 2px;
    border: 0; background: none; border-radius: 0;
    color: var(--destaque); font-size: 18px; font-weight: 800;
  }
  .agenda li.mes:first-child { padding-top: 0; }
  .agenda li.mes::after { content: ""; flex: 1; height: 1px; background: rgba(201,164,99,.35); }
  .agenda .ver { display: block; color: var(--destaque); font-size: 12px; font-weight: 600; margin-top: 4px; }

  .banner { margin: auto; border: 0; padding: 0; background: none; overflow: visible; color: var(--texto); }
  .banner::backdrop { background: rgba(0,0,0,.8); }
  .banner img {
    display: block; width: min(88vw, 420px); max-height: 70vh; object-fit: contain;
    border-radius: 12px; background: var(--fundo-2);
  }
  .banner .cartao {
    width: min(88vw, 420px); padding: 28px 24px; border-radius: 12px;
    background: var(--fundo-2); border: 1px solid rgba(201,164,99,.35);
  }
  .banner .cartao .dia { display: block; color: var(--destaque); font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  .banner .cartao strong { display: block; font-size: 20px; font-weight: 600; margin-top: 4px; }
  .banner .acoes { display: grid; gap: 10px; margin-top: 14px; }
  .banner .inscrever, .banner .compartilhar {
    display: flex; justify-content: center; align-items: center; gap: 8px; padding: 14px 24px;
    border: 0; border-radius: 999px; cursor: pointer; text-decoration: none;
    background: var(--botao); color: var(--botao-texto);
    font: 600 17px/1.2 inherit; font-family: inherit;
  }
  .banner .inscrever { background: var(--destaque); }
  .banner [hidden] { display: none; }
  .banner .compartilhar svg { width: 20px; height: 20px; }
  .banner .status { margin-top: 8px; min-height: 18px; text-align: center; font-size: 13px; color: var(--texto-suave); }
  .banner .fechar {
    position: absolute; top: -14px; right: -14px; width: 36px; height: 36px;
    border: 0; border-radius: 50%; background: var(--destaque); color: var(--botao-texto);
    font-family: inherit; font-weight: 600; font-size: 24px; line-height: 1; cursor: pointer;
  }
  .banner .quadro { position: relative; }
  button:focus-visible { outline: 3px solid var(--texto); outline-offset: 3px; }

  .cultos { margin-top: 28px; }
  .cultos h2 { font-size: 20px; font-weight: 600; margin-bottom: 16px; }
  .cultos ul { list-style: none; display: grid; gap: 10px; }
  .cultos li {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 14px 18px; border-radius: 16px; text-align: left;
    border: 1px solid rgba(201,164,99,.35); background: rgba(255,255,255,.04);
  }
  .cultos strong { font-weight: 600; font-size: 16px; }
  .cultos small { display: block; color: var(--texto-suave); font-size: 13px; margin-top: 2px; }
  .cultos .live, .agenda .live {
    display: flex; width: fit-content; align-items: center; gap: 5px; margin-top: 6px;
    color: #ff4e45; font-size: 12px; font-weight: 600; text-decoration: none;
  }
  .cultos .live svg, .agenda .live svg { width: 16px; height: 16px; }
  .cultos .hora { color: var(--destaque); font-weight: 800; font-size: 16px; white-space: nowrap; }
  h2 { font-size: 20px; font-weight: 600; margin-bottom: 16px; }
  .eventos { margin-top: 36px; }
  .eventos .agenda { margin-top: 0; }
  .eventos .aviso { margin-top: 0; }

  .aviso { margin-top: 28px; text-align: center; color: var(--texto-suave); font-size: 15px; }
  footer { margin-top: 40px; font-size: 13px; color: var(--texto-suave); text-align: center; }
</style>
</head>
<body>
<main>
  <a class="voltar" href="index.html" data-clique="Agenda: Voltar">&larr; Voltar</a>

  <span class="logo"><img alt="Cura Nossa Terra" src="img/igreja.webp"></span>

  <h1>Agenda</h1>
  <p class="frase">Programe-se e venha com a gente.</p>

  <!-- CULTOS FIXOS: horários ficam no comum.js (CULTOS) -->
  <section class="cultos">
    <h2>Cultos</h2>
    <ul id="cultos"></ul>
  </section>

  <section class="eventos">
    <h2>Próximos eventos</h2>
    <ul class="agenda" id="agenda"></ul>
    <p class="aviso" id="aviso" role="status">Carregando agenda…</p>
  </section>

  <dialog class="banner" id="banner" aria-label="Detalhes do evento">
    <div class="quadro">
      <img id="bannerImg" alt="">
      <!-- sem banner: mostra nome e data do evento no lugar da imagem -->
      <div class="cartao" id="bannerCartao"><span class="dia" id="bannerDia"></span><strong id="bannerTitulo"></strong></div>
      <button class="fechar" id="bannerFechar" type="button" aria-label="Fechar">&times;</button>
    </div>
    <div class="acoes">
      <a class="inscrever" id="bannerInscrever" data-clique="Inscrição" target="_blank" rel="noopener">Quero me inscrever</a>
      <button class="compartilhar" id="bannerCompartilhar" type="button" data-clique="Compartilhar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
        Compartilhar
      </button>
    </div>
    <p class="status" id="bannerStatus" role="status"></p>
  </dialog>

  <footer>Desenvolvido por Jhow Silva © 2026 | Todos os direitos reservados.</footer>
</main>

<script src="comum.js"></script>
<script>
  // PLANILHA (endereço e leitura ficam no comum.js).
  // As colunas são achadas pelo nome do cabeçalho (a ordem não importa):
  //   Data ou Dia | Horário ou Hora | Evento | Local ou Obs | Ministério | Banner | Inscrição | Ao vivo | ✓
  // Ao vivo: marcado (caixinha, "sim" ou "x") = mostra "Ao vivo no YouTube" e liga a barra vermelha do site.
  // Evento marcado com ✓ some na hora; o que não estiver marcado some sozinho no dia seguinte à data.
  // Banner: link de compartilhamento de uma imagem no Google Drive
  // (o arquivo precisa estar como "Qualquer pessoa com o link pode ver").
  // Inscrição: link de um formulário (ex.: Google Forms) -> botão "Quero me inscrever".
  // Evento com banner ou inscrição ganha o "Saiba mais" e abre a janela de detalhes.
  const DIAS_SEMANA = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
  const MESES = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
    "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];

  // Coluna Ministério -> logo. A primeira palavra-chave encontrada no nome vence;
  // vazio ou desconhecido (ex.: "Cura Nossa Terra") usa o logo da igreja.
  const LOGOS = [
    { chaves: ["jove"], img: "img/jovens.webp" },
    { chaves: ["louvor"], img: "img/louvor.webp" },
    { chaves: ["danca"], img: "img/danca.webp" },
    { chaves: ["infantil", "kids", "semente", "crianca"], img: "img/infantil.webp" },
    { chaves: ["midia", "comunica"], img: "img/midia.webp" },
  ];
  const LOGO_IGREJA = "img/igreja.webp";
  function logoDo(ministerio) {
    const n = normalizar(ministerio);
    return (LOGOS.find((l) => l.chaves.some((c) => n.includes(c))) || {}).img || LOGO_IGREJA;
  }

  // "15:00" -> "15h", "19:30" -> "19h30" (outros formatos ficam como estão)
  function formatarHora(texto) {
    const m = texto.match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);
    return m ? `${Number(m[1])}h${m[2] === "00" ? "" : m[2]}` : texto;
  }

  // Link do Drive ("…/file/d/ID/view", "…open?id=ID") -> endereço direto da imagem.
  // Qualquer outro link de imagem é usado como está.
  function linkDaImagem(texto) {
    if (!texto) return "";
    const m = texto.match(/drive\.google\.com\/.*(?:\/d\/|[?&]id=)([\w-]{20,})/);
    return m ? `https://lh3.googleusercontent.com/d/${m[1]}=w1600` : texto;
  }

  // CULTOS FIXOS (lista CULTOS no comum.js)
  for (const c of CULTOS) {
    const li = document.createElement("li");
    const info = document.createElement("div");
    info.append(criar("strong", "", c.nome));
    if (c.obs) info.append(criar("small", "", c.obs));
    if (c.aoVivo) {
      const live = document.createElement("a");
      live.className = "live";
      live.href = LINK_AO_VIVO;
      live.dataset.clique = "Agenda: Ao vivo " + c.nome;
      live.innerHTML = YOUTUBE_SVG + "Ao vivo no YouTube";
      info.append(live);
    }
    li.append(info, criar("span", "hora", horarioDoCulto(c)));
    document.getElementById("cultos").append(li);
  }

  const lista = document.getElementById("agenda");
  const aviso = document.getElementById("aviso");

  function criar(tag, classe, texto) {
    const el = document.createElement(tag);
    if (classe) el.className = classe;
    el.textContent = texto;
    return el;
  }

  // Descobre em qual coluna está cada informação pelo texto do cabeçalho
  function acharColunas(cabecalho) {
    const nomes = cabecalho.map(normalizar);
    const achar = (...chaves) => nomes.findIndex((n) => chaves.some((c) => n.includes(c)));
    return {
      feito: achar("✓", "conclu"),
      dia: achar("data", "dia"),
      hora: achar("hor"),
      evento: achar("evento"),
      obs: achar("local", "obs"),
      ministerio: achar("minist"),
      banner: achar("banner"),
      inscricao: achar("inscri", "formul"),
      aovivo: achar("ao vivo", "transmi"),
    };
  }

  // "28/11" ou "28/11/2026" -> Date (ou null se não for data)
  function lerData(texto) {
    const m = texto.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);
    if (!m) return null;
    const hoje = new Date();
    let ano = m[3] ? Number(m[3].length === 2 ? "20" + m[3] : m[3]) : hoje.getFullYear();
    let data = new Date(ano, m[2] - 1, m[1]);
    // sem ano e muito no passado: é do ano que vem (ex.: janeiro visto em dezembro)
    if (!m[3] && hoje - data > 180 * 864e5) data = new Date(ano + 1, m[2] - 1, m[1]);
    return data;
  }

  async function carregar() {
    try {
      const [cabecalho, ...linhas] = await lerPlanilha();
      const col = acharColunas(cabecalho);
      const pegar = (l, i) => (i >= 0 ? (l[i] || "").trim() : "");

      const hoje = new Date();
      hoje.setHours(0, 0, 0, 0);

      const eventos = linhas
        .map((l) => {
          const dia = pegar(l, col.dia);
          const data = lerData(dia);
          return {
            feito: pegar(l, col.feito).toUpperCase() === "TRUE",
            // "Sex, 20/11" (sem o ano: ele já aparece no título do mês)
            dia: data ? `${DIAS_SEMANA[data.getDay()]}, ${String(data.getDate()).padStart(2, "0")}/${String(data.getMonth() + 1).padStart(2, "0")}` : dia,
            data,
            hora: pegar(l, col.hora),
            evento: arrumarTexto(pegar(l, col.evento)), // corrige maiúsculas e acentos (comum.js)
            obs: arrumarTexto(pegar(l, col.obs)),
            ministerio: pegar(l, col.ministerio),
            banner: linkDaImagem(pegar(l, col.banner)),
            // só aceita link de site (evita texto solto virar link quebrado)
            inscricao: /^https?:\/\//i.test(pegar(l, col.inscricao)) ? pegar(l, col.inscricao) : "",
            aovivo: /^(true|sim|s|x|✓)$/i.test(pegar(l, col.aovivo)),
          };
        })
        .filter((e) => e.evento && !e.feito && !(e.data && e.data < hoje))
        // com data primeiro, em ordem (mesmo dia: por horário); sem data (ex.: "Domingo") mantém a ordem da planilha
        .sort((a, b) => (a.data && b.data ? a.data - b.data || a.hora.localeCompare(b.hora, "pt", { numeric: true }) : !a.data - !b.data));

      if (!eventos.length) {
        aviso.textContent = "Nenhum evento na agenda no momento.";
        return;
      }
      // título a cada mês novo ("Novembro"); de anos seguintes leva o ano ("Janeiro de 2027")
      let mesAnterior = "";
      for (const e of eventos) {
        if (e.data) {
          const mes = MESES[e.data.getMonth()] +
            (e.data.getFullYear() !== hoje.getFullYear() ? " de " + e.data.getFullYear() : "");
          if (mes !== mesAnterior) {
            lista.append(criar("li", "mes", mes));
            mesAnterior = mes;
          }
        }
        const { dia, hora, evento, obs, ministerio, banner, inscricao, aovivo } = e;
        const li = document.createElement("li");
        const logo = document.createElement("img");
        logo.className = "min";
        logo.src = logoDo(ministerio);
        logo.alt = ministerio ? "Ministério " + ministerio : "Cura Nossa Terra";
        const info = criar("div", "info", "");
        if (dia) info.append(criar("span", "dia", dia));
        info.append(criar("strong", "", evento));
        if (obs) info.append(criar("small", "", obs));
        if (aovivo) {
          const live = document.createElement("a");
          live.className = "live";
          live.dataset.clique = "Agenda: Ao vivo " + evento;
          live.href = LINK_AO_VIVO;
          live.innerHTML = YOUTUBE_SVG + "Ao vivo no YouTube";
          live.addEventListener("click", (ev) => ev.stopPropagation()); // não abre o "Saiba mais"
          info.append(live);
        }
        if (banner || inscricao) {
          // evento com banner ou inscrição vira clicável
          info.append(criar("span", "ver", "Saiba mais ›"));
          li.className = "tem-banner";
          li.tabIndex = 0;
          li.setAttribute("role", "button");
          li.dataset.clique = "Saiba mais: " + evento;
          li.addEventListener("click", () => abrirBanner(e));
          li.addEventListener("keydown", (ev) => {
            if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); abrirBanner(e); }
          });
        }
        li.append(logo, info, criar("span", "hora", formatarHora(hora)));
        lista.append(li);
      }
      aviso.textContent = "";
    } catch {
      aviso.textContent = "Não foi possível carregar a agenda agora. Tente novamente mais tarde.";
    }
  }
  carregar();

  // SAIBA MAIS: banner ampliado (ou nome do evento), inscrição e compartilhar
  const janela = document.getElementById("banner");
  const janelaImg = document.getElementById("bannerImg");
  const janelaCartao = document.getElementById("bannerCartao");
  const janelaInscrever = document.getElementById("bannerInscrever");
  const janelaStatus = document.getElementById("bannerStatus");
  let eventoAberto = null;
  let bannerBaixando = null;

  function abrirBanner(e) {
    eventoAberto = e;
    bannerBaixando = null;
    if (e.banner) {
      // já baixa a imagem ao abrir: no iPhone o compartilhar precisa acontecer logo após o toque
      bannerBaixando = fetch(e.banner).then((r) => {
        if (!r.ok) throw new Error(r.status);
        return r.blob();
      });
      bannerBaixando.catch(() => {});
      janelaImg.src = e.banner;
      janelaImg.alt = "Banner: " + e.evento;
    }
    janelaImg.hidden = !e.banner;
    janelaCartao.hidden = !!e.banner;
    document.getElementById("bannerDia").textContent = [e.dia, formatarHora(e.hora)].filter(Boolean).join(" · ");
    document.getElementById("bannerTitulo").textContent = e.evento;
    janelaInscrever.hidden = !e.inscricao;
    janelaInscrever.href = e.inscricao || "#";
    janelaInscrever.dataset.clique = "Inscrição: " + e.evento;
    document.getElementById("bannerCompartilhar").dataset.clique = "Compartilhar: " + e.evento;
    janelaStatus.textContent = "";
    janela.showModal();
  }

  document.getElementById("bannerFechar").addEventListener("click", () => janela.close());
  // toque fora do banner também fecha
  janela.addEventListener("click", (ev) => { if (ev.target === janela) janela.close(); });

  document.getElementById("bannerCompartilhar").addEventListener("click", async () => {
    const e = eventoAberto;
    const quando = [e.dia, formatarHora(e.hora)].filter(Boolean).join(" às ");
    const texto = `${e.evento}${quando ? " | " + quando : ""}\nCura Nossa Terra`
      + (e.inscricao ? `\nInscreva-se: ${e.inscricao}` : "");
    const link = location.href.split("#")[0];
    try {
      if (!bannerBaixando) {
        // sem banner: compartilha só o texto com os links
        if (navigator.share) await navigator.share({ title: e.evento, text: texto, url: link });
        else {
          await navigator.clipboard.writeText(`${texto}\n${link}`);
          janelaStatus.textContent = "Informações copiadas. É só colar e enviar!";
        }
        return;
      }
      janelaStatus.textContent = "Preparando…";
      const blob = await bannerBaixando;
      const ext = (blob.type.split("/")[1] || "jpg").replace("jpeg", "jpg");
      const arquivo = new File([blob], `${e.evento}.${ext}`.replace(/[\\/:*?"<>|]/g, ""), { type: blob.type });
      janelaStatus.textContent = "";

      if (navigator.canShare && navigator.canShare({ files: [arquivo] })) {
        // celular: compartilha a própria imagem (WhatsApp, Instagram…)
        await navigator.share({ files: [arquivo], title: e.evento, text: `${texto}\n${link}` });
      } else if (navigator.share) {
        await navigator.share({ title: e.evento, text: texto, url: link });
      } else {
        // computador sem compartilhamento: baixa a imagem
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = arquivo.name;
        a.click();
        URL.revokeObjectURL(a.href);
        janelaStatus.textContent = "Banner baixado. É só enviar para quem quiser!";
      }
    } catch (erro) {
      if (erro.name === "AbortError") { janelaStatus.textContent = ""; return; }
      janelaStatus.textContent = "Não foi possível compartilhar agora.";
    }
  });
</script>
</body>
</html>
